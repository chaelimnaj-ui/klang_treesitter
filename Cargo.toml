[package]
name = "tree-sitter-klang"
description = "A tree-sitter grammar for the custom upd dcs language called klang"
version = "0.2.0"
authors = ["Jan Michael Tauli <jm1michael2@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "klang"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "git@github.com:chaelimnaj-ui/klang_treesitter.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
